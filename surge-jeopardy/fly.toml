# fly.toml app configuration file generated for jeopardy-cergkq on 2026-09-23T22:24:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jeopardy-board'
primary_region = 'ewr'

[build]

[env]
  DATA_DIR = '/app/data'
  NODE_ENV = 'production'
  PORT = '3001'
  # HOST_PASSCODE is required in production but must NOT go here (this file is
  # committed). Set it with: fly secrets set HOST_PASSCODE=choose-a-passcode

[[mounts]]
  source = 'jeopardy_data'
  destination = '/app/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
